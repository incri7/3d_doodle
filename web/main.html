<meta charset="utf-8">
<title>Main</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap">
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: #0d0f13; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .showroom-btn { position: fixed; left: 28px; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    font: 500 14px/1 "Oswald", "Arial Narrow", sans-serif; letter-spacing: .32em; text-transform: uppercase; color: #f1e6cf;
    padding: 14px 30px 14px 34px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, rgba(43, 46, 52, 0.85), rgba(13, 15, 19, 0.9));
    border: 1px solid rgba(255, 214, 150, 0.55);
    box-shadow: 0 0 18px rgba(255, 200, 120, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(6px); transition: box-shadow .25s, border-color .25s, color .25s; }
  .showroom-btn:hover { color: #fff; border-color: rgba(255, 220, 160, 0.95); box-shadow: 0 0 28px rgba(255, 200, 120, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.18); }
  .showroom-btn:focus-visible { outline: 2px solid #f1c27a; outline-offset: 3px; }
</style>

<canvas id="stage" aria-label="Agni Express bus. Drag to rotate."></canvas>
<button class="showroom-btn" id="showroom-btn" type="button">Showroom</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---------------------------------------------------------------- studio
const STUDIO = new THREE.Color(0x0d0f13);
const scene = new THREE.Scene();
scene.background = STUDIO;
scene.fog = new THREE.Fog(STUDIO, 26, 62);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.45;

// Curved backdrop wall: lit band near the floor, falling off into darkness.
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#07080a'); gr.addColorStop(0.55, '#15181e'); gr.addColorStop(0.86, '#2a2e36'); gr.addColorStop(1, '#1a1d23');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(48, 48, 34, 96, 1, true),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false }));
  wall.position.y = 17;
  scene.add(wall);
}

// Polished floor: a mirror under a dark, partly transparent lacquer layer, so
// the bus reflects softly and the floor fades into the room.
const mirror = new Reflector(new THREE.CircleGeometry(48, 96), {
  textureWidth: 1024, textureHeight: 1024, color: 0x8a8d92, clipBias: 0.003,
});
mirror.rotation.x = -Math.PI / 2;
scene.add(mirror);
const floorFade = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgb(205,205,205)'); gr.addColorStop(0.3, 'rgb(225,225,225)'); gr.addColorStop(1, 'rgb(255,255,255)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const lacquer = new THREE.Mesh(new THREE.CircleGeometry(48, 96),
  new THREE.MeshStandardMaterial({ color: 0x14161b, roughness: 0.55, metalness: 0, transparent: true, opacity: 0.84, alphaMap: floorFade }));
lacquer.rotation.x = -Math.PI / 2;
lacquer.position.y = 0.004;
lacquer.receiveShadow = true;
scene.add(lacquer);

// Turntable: brushed dark disc with a glowing edge ring and fine radial grooves.
const turntable = new THREE.Group();
scene.add(turntable);
const TT_R = 7.4, TT_H = 0.14;
{
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#2b2e34'; g.fillRect(0, 0, 512, 512);
  for (let r = 6; r < 256; r += 3) {                     // concentric brushing
    g.strokeStyle = `rgba(${r % 2 ? 255 : 0},${r % 2 ? 255 : 0},${r % 2 ? 255 : 0},0.035)`;
    g.beginPath(); g.arc(256, 256, r, 0, Math.PI * 2); g.stroke();
  }
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 2;
  for (const r of [120, 210]) { g.beginPath(); g.arc(256, 256, r, 0, Math.PI * 2); g.stroke(); }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const top = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.38, metalness: 0.75 });
  const side = new THREE.MeshStandardMaterial({ color: 0x17191d, roughness: 0.3, metalness: 0.9 });
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(TT_R, TT_R + 0.08, TT_H, 128), [side, top, side]);
  disc.position.y = TT_H / 2;
  disc.receiveShadow = true;
  turntable.add(disc);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(TT_R + 0.06, 0.025, 8, 192),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.25, 0.7), toneMapped: false }));
  ring.rotation.x = Math.PI / 2; ring.position.y = TT_H * 0.55;
  scene.add(ring);
}
// Soft contact shadow under the bus (rotates with it).
const contact = (() => {
  const W = 64, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), img = g.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = Math.max(0, Math.abs(x / W - 0.5) - 0.22) * 3.6, dy = Math.max(0, Math.abs(y / H - 0.5) - 0.4) * 12.4;
    const d = Math.hypot(dx, dy), a = Math.pow(1 - THREE.MathUtils.smoothstep(d, 0, 0.6), 1.5) * 0.85;
    img.data.set([0, 0, 0, a * 255], (y * W + x) * 4);
  }
  g.putImageData(img, 0, 0);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 12.4).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.position.y = TT_H + 0.005;
  return m;
})();
turntable.add(contact);

// Lights: key spot with soft shadow, two cool rim lights, a warm fill, and
// overhead light strips the paint can catch.
scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x141519, 0.2));
const key = new THREE.SpotLight(0xfff3e4, 300, 60, 0.5, 0.85, 1.6);
key.position.set(9, 15, 11);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0002; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
key.shadow.camera.near = 5; key.shadow.camera.far = 45;
scene.add(key, key.target);
const rimL = new THREE.SpotLight(0x9fc0ff, 200, 50, 0.5, 0.9, 1.6); rimL.position.set(-12, 7, -10);
const rimR = new THREE.SpotLight(0xbcd3ff, 150, 50, 0.5, 0.9, 1.6); rimR.position.set(12, 6, -12);
const fill = new THREE.SpotLight(0xffd8b0, 70, 50, 0.6, 1, 1.6); fill.position.set(-10, 4, 12);
for (const l of [rimL, rimR, fill]) { l.target.position.set(0, 1.5, 0); scene.add(l, l.target); }
key.target.position.set(0, 1.2, 0);
for (const x of [-4.5, 0, 4.5]) {
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.06, 16),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.35, 2.25), toneMapped: false }));
  strip.position.set(x, 13, 0);
  scene.add(strip);
}

// ---------------------------------------------------------------- camera
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 6.5;
controls.maxDistance = 40;
controls.enableZoom = false;
camera.position.set(10.5, 3.6, 13.5);
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI / 2 - 0.03;          // never under the floor
controls.target.set(0, 1.7, 0);

const bus = new THREE.Group();
bus.position.y = TT_H;
turntable.add(bus);

// ---------------------------------------------------------------- post
// HDR -> clean NaN/overflow -> gentle bloom (ring, strips, lamps) -> AgX -> vignette.
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const quad = { vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }' };
composer.addPass(new ShaderPass({ ...quad,
  uniforms: { tDiffuse: { value: null } },
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec3 v = texture2D(tDiffuse, vUv).rgb;
      bool bad = !(v.r == v.r && v.g == v.g && v.b == v.b) || any(isinf(v)) || any(isnan(v));
      gl_FragColor = vec4(bad ? vec3(0.0) : clamp(v, 0.0, 48.0), 1.0); }` }));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.3, 0.45, 2.2));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({ ...quad,
  uniforms: { tDiffuse: { value: null } },
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5;
      gl_FragColor = vec4(c.rgb * (1.0 - 0.38 * smoothstep(0.2, 0.9, dot(d, d) * 2.4)), c.a); }` }));

// ---------------------------------------------------------------- model
// Lacquered paint: the baked atlas gets a clearcoat on its glossy areas only.
function lacquerPaint(m) {
  const p = {
    name: m.name, color: m.color, map: m.map, normalMap: m.normalMap, normalScale: m.normalScale,
    roughness: m.roughness, metalness: m.metalness, roughnessMap: m.roughnessMap, metalnessMap: m.metalnessMap,
    emissive: m.emissive, emissiveMap: m.emissiveMap, emissiveIntensity: m.emissiveIntensity * 1.4,
    side: m.side, clearcoat: 0.8, clearcoatRoughness: 0.12,
  };
  for (const k in p) if (p[k] == null) delete p[k];
  const pm = new THREE.MeshPhysicalMaterial(p);
  pm.onBeforeCompile = sh => {
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n\tfloat coatMask = 1.0 - smoothstep(0.28, 0.5, roughnessFactor);')
      .replace('#include <lights_physical_fragment>', THREE.ShaderChunk.lights_physical_fragment.replace('material.clearcoat = clearcoat;', 'material.clearcoat = clearcoat * coatMask;'))
      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\n\tgl_FragColor.rgb = clamp(gl_FragColor.rgb, 0.0, 48.0);');
  };
  pm.customProgramCacheKey = () => 'showroom-coat';
  return pm;
}

const fileLoader = new THREE.FileLoader();
fileLoader.setResponseType('text');
fileLoader.load('agni_bus.glb.b64.txt', b64 => {
  const bin = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
  const loader = new GLTFLoader();
  // Embedded textures load through <img> (strict hosts block the fetch-based loader).
  loader.register(parser => { parser.textureLoader = new THREE.TextureLoader(parser.options.manager); return { name: 'img_textures' }; });
  loader.parse(bin.buffer, '', gltf => {
    const done = new Map();
    gltf.scene.traverse(o => {
      if (o.name.startsWith('COL-')) { o.visible = false; return; }
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = true;
      const m = o.material;
      if (m.transmission > 0) {
        m.thickness = 0.01; m.envMapIntensity = 1.4; m.roughness = Math.max(0.08, Math.min(m.roughness, 0.12));
        o.castShadow = false;
        return;
      }
      if (!done.has(m)) done.set(m, lacquerPaint(m));
      o.material = done.get(m);
    });
    bus.add(gltf.scene);
  }, fail);
}, undefined, fail);
function fail(err) { console.error(err); }

// ---------------------------------------------------------------- loop
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  mirror.getRenderTarget().setSize(Math.min(2048, w * renderer.getPixelRatio()), Math.min(2048, h * renderer.getPixelRatio()));
  camera.aspect = w / h;
  // keep the whole bus in frame on narrow screens
  camera.fov = w / h < 0.9 ? 55 : 38;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  composer.render();
});
</script>
