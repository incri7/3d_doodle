<meta charset="utf-8">
<title>Main</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
</style>

<canvas id="stage" aria-label="Agni Express bus. Drag to rotate."></canvas>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Black showroom.
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 22, 50);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.45;

// Glossy black floor: a mirror under a dark, partly transparent layer.
const mirror = new Reflector(new THREE.CircleGeometry(48, 96), { textureWidth: 1024, textureHeight: 1024, color: 0x6a6d72, clipBias: 0.003 });
mirror.rotation.x = -Math.PI / 2;
scene.add(mirror);
const floor = new THREE.Mesh(new THREE.CircleGeometry(48, 96),
  new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.55, transparent: true, opacity: 0.88 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.004;
floor.receiveShadow = true;
scene.add(floor);

// Lights.
scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x000000, 0.2));
const key = new THREE.SpotLight(0xfff3e4, 300, 60, 0.5, 0.85, 1.6);
key.position.set(9, 15, 11);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0002; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
key.target.position.set(0, 1.2, 0);
scene.add(key, key.target);
for (const [c, i, x, y, z] of [[0x9fc0ff, 200, -12, 7, -10], [0xbcd3ff, 150, 12, 6, -12], [0xffd8b0, 70, -10, 4, 12]]) {
  const l = new THREE.SpotLight(c, i, 50, 0.5, 0.9, 1.6);
  l.position.set(x, y, z); l.target.position.set(0, 1.5, 0);
  scene.add(l, l.target);
}

// Camera: rotate with the mouse only.
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.enableZoom = false;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.target.set(0, 1.7, 0);
camera.position.set(10.5, 3.6, 13.5);

// Bus with lacquered paint (clearcoat on glossy areas only).
function lacquer(m) {
  const p = {
    color: m.color, map: m.map, normalMap: m.normalMap, normalScale: m.normalScale,
    roughness: m.roughness, metalness: m.metalness, roughnessMap: m.roughnessMap, metalnessMap: m.metalnessMap,
    emissive: m.emissive, emissiveMap: m.emissiveMap, emissiveIntensity: m.emissiveIntensity,
    side: m.side, clearcoat: 0.8, clearcoatRoughness: 0.12,
  };
  for (const k in p) if (p[k] == null) delete p[k];
  const pm = new THREE.MeshPhysicalMaterial(p);
  pm.onBeforeCompile = sh => {
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n\tfloat coatMask = 1.0 - smoothstep(0.28, 0.5, roughnessFactor);')
      .replace('#include <lights_physical_fragment>', THREE.ShaderChunk.lights_physical_fragment.replace('material.clearcoat = clearcoat;', 'material.clearcoat = clearcoat * coatMask;'));
  };
  pm.customProgramCacheKey = () => 'showroom-coat';
  return pm;
}
const fileLoader = new THREE.FileLoader();
fileLoader.setResponseType('text');
fileLoader.load('agni_bus.glb.b64.txt', b64 => {
  const bin = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
  const loader = new GLTFLoader();
  loader.register(parser => { parser.textureLoader = new THREE.TextureLoader(parser.options.manager); return { name: 'img_textures' }; });
  loader.parse(bin.buffer, '', gltf => {
    const done = new Map();
    gltf.scene.traverse(o => {
      if (o.name.startsWith('COL-')) { o.visible = false; return; }
      if (!o.isMesh) return;
      o.castShadow = o.receiveShadow = true;
      const m = o.material;
      if (m.transmission > 0) { m.thickness = 0.01; m.roughness = Math.max(0.08, Math.min(m.roughness, 0.12)); o.castShadow = false; return; }
      if (!done.has(m)) done.set(m, lacquer(m));
      o.material = done.get(m);
    });
    scene.add(gltf.scene);
  }, console.error);
}, undefined, console.error);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.9 ? 55 : 38;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
